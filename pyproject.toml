[project]
name = "mcpgram"
version = "0.1.0"
description = "Official Python SDK for MCPGRAM — one client for native connectors and external MCP servers, with adapters for LangGraph and CrewAI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "requests>=2.28",
  "pydantic>=2.0",
]

[project.optional-dependencies]
langgraph = ["langchain-core>=0.2.0"]
crewai = ["crewai>=0.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcpgram"]
